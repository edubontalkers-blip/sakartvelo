name: Daily Article Generator

on:
  schedule:
    - cron: '0 7 * * *'  # Every day at 7:00 UTC (9:00 Tbilisi time)
  workflow_dispatch:       # Allow manual run from GitHub Actions tab

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate article
        run: python scripts/generate_article.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push new article
        run: |
          git config user.email "bot@sakartvelo.ai"
          git config user.name "Chacha Bot 🍶"
          git add .
          git diff --staged --quiet || git commit -m "📝 New article $(date +%Y-%m-%d)"
          git push
