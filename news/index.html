  if (!['ru','en','tr','ar','he','fa','de','it','es'].includes(saved)) saved = 'en';
  if (saved === 'en' && ['ru','tr','ar','he','fa','de','it','es'].indexOf(browserLang) !== -1) saved = browserLang;
  document.getElementById('langSel').value = saved;
  setLang(saved);
})();
</script>
</body>
