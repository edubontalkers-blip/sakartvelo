const LANGUAGES = [
  {code:'ru', flag:'🇷🇺', name:'Русский'},
  {code:'en', flag:'🇬🇧', name:'English'},
  {code:'tr', flag:'🇹🇷', name:'Türkçe'},
  {code:'ar', flag:'🇸🇦', name:'العربية'},
  {code:'he', flag:'🇮🇱', name:'עברית'},
  {code:'fa', flag:'🇮🇷', name:'فارسی'},
  {code:'de', flag:'🇩🇪', name:'Deutsch'},
  {code:'it', flag:'🇮🇹', name:'Italiano'},
  {code:'es', flag:'🇪🇸', name:'Español'},
];

function detectLang(){
  const validCodes = LANGUAGES.map(l => l.code);
  let saved = null;
  try { saved = localStorage.getItem('sak_lang'); } catch(e) {}
  if (saved && validCodes.indexOf(saved) !== -1) return saved;
  const nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  if (validCodes.indexOf(nav) !== -1) return nav;
  return 'en';
}
let curLang = detectLang();

function esc(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function renderPlaces(containerId, items){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map(function(p){
    const sourceText = esc(p.source) + (p.phone ? ' · ' + esc(p.phone) : '');
    const sourceHtml = p.sourceUrl
      ? '<a href="' + p.sourceUrl + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">' + sourceText + ' ↗</a>'
      : sourceText;
    return '<div class="place">' +
      '<span class="name">' + esc(p.name) + '</span> <span class="loc">' + esc(p.loc) + '</span>' +
      '<div class="desc">' + esc(p.desc) + '</div>' +
      '<div class="source">' + sourceHtml + '</div>' +
    '</div>';
  }).join('');
}

function render(){
  const t = BEST_I18N[curLang] || BEST_I18N.en;
  const isRTL = (curLang === 'ar' || curLang === 'he' || curLang === 'fa');
  document.getElementById('htmlRoot').setAttribute('lang', curLang);
  document.getElementById('htmlRoot').setAttribute('dir', isRTL ? 'rtl' : 'ltr');
  document.getElementById('pageTitle').textContent = t.title + ' | sakartvelo.ai';
  document.getElementById('metaDesc').setAttribute('content', t.metaDesc);
  document.getElementById('h1').textContent = t.h1;
  document.getElementById('intro').textContent = t.intro;
  document.getElementById('disclaimer').textContent = t.disclaimer;
  document.getElementById('s1').textContent = t.s1;
  document.getElementById('s1note').textContent = t.s1note;
  document.getElementById('s2').textContent = t.s2;
  document.getElementById('s2note').textContent = t.s2note;
  document.getElementById('s3').textContent = t.s3;
  document.getElementById('s3note').textContent = t.s3note;
  document.getElementById('s4').textContent = t.s4;
  document.getElementById('s4note').textContent = t.s4note;
  document.getElementById('s5').textContent = t.s5;
  document.getElementById('s5note').textContent = t.s5note;
  document.getElementById('backLink').textContent = t.back;
  document.getElementById('backLink2').textContent = t.back;
  document.getElementById('footer').textContent = t.footer;
  renderPlaces('restList', t.restaurants);
  renderPlaces('spaList', t.spas);
  renderPlaces('dentalList', t.dental);
  renderPlaces('halalList', t.halal);
  renderPlaces('veganList', t.vegan);
}

function openLangSheet(){
  const t = BEST_I18N[curLang] || BEST_I18N.en;
  document.getElementById('langSheetTitle').textContent = t.langTitle;
  document.getElementById('langGrid').innerHTML = LANGUAGES.map(l =>
    '<div class="langItem' + (l.code===curLang?' sel':'') + '" onclick="switchLang(\'' + l.code + '\')">' +
    '<div style="font-size:1.3rem">' + l.flag + '</div><div>' + l.name + '</div></div>'
  ).join('');
  document.getElementById('langOverlay').style.display = 'block';
}
function closeLangSheet(){ document.getElementById('langOverlay').style.display = 'none'; }
function switchLang(code){
  curLang = code;
  try { localStorage.setItem('sak_lang', code); } catch(e) {}
  render();
  closeLangSheet();
}

render();
</script>
