:root{--wine:#8b1a1a;--gold:#c4960a;--dark:#1a0d10;--card:#fff8f5;--bg:#fff;--ink:#1a0d10;--muted:#888;--line:#e8ddd5;--radius:16px}

header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:8px}
.logo{font-weight:900;color:var(--wine);text-decoration:none;font-size:1.1rem}
.hbtns{display:flex;gap:8px;align-items:center}
.langBtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:1rem}
main{max-width:640px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:1.7rem;font-weight:900;color:var(--wine);margin-bottom:12px;line-height:1.25}

.highlights{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px}
.highlights li{margin-bottom:8px}

footer{text-align:center;padding:24px;color:var(--muted);font-size:.8rem}
footer a{color:var(--wine);text-decoration:none}
#langOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100}
#langSheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:20px;max-height:70vh;overflow-y:auto}
.langGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.langItem{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-size:.85rem}

ی گرجستان 🇬🇪", "langTitle": "زبان"}};
const LANGUAGES = [{"code": "ru", "flag": "🇷🇺", "name": "Русский"}, {"code": "en", "flag": "🇬🇧", "name": "English"}, {"code": "tr", "flag": "🇹🇷", "name": "Türkçe"}, {"code": "ar", "flag": "🇸🇦", "name": "العربية"}, {"code": "he", "flag": "🇮🇱", "name": "עברית"}, {"code": "fa", "flag": "🇮🇷", "name": "فارسی"}, {"code": "de", "flag": "🇩🇪", "name": "Deutsch"}, {"code": "it", "flag": "🇮🇹", "name": "Italiano"}, {"code": "es", "flag": "🇪🇸", "name": "Español"}];
const CATEGORY = "wine";
const DAYS = "4";

function detectLang(){
  const validCodes = LANGUAGES.map(l => l.code);
  let saved = null;
  try { saved = localStorage.getItem('sak_lang'); } catch(e) {}
  if (saved && validCodes.indexOf(saved) !== -1) return saved;
  const nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  if (validCodes.indexOf(nav) !== -1) return nav;
  return 'en';
}
let curLang = detectLang();

function render(){
  const t = PAGE_I18N[curLang] || PAGE_I18N.en;
  const isRTL = (curLang === 'ar' || curLang === 'he' || curLang === 'fa');
  document.getElementById('htmlRoot').setAttribute('lang', curLang);
  document.getElementById('htmlRoot').setAttribute('dir', isRTL ? 'rtl' : 'ltr');
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('metaDesc').setAttribute('content', t.metaDesc);
  document.getElementById('h1').textContent = t.h1;
  document.getElementById('intro').textContent = t.intro;
  document.getElementById('highlightsList').innerHTML = t.highlights.map(h => '<li>' + h + '</li>').join('');
  document.getElementById('ctaBtn').textContent = t.cta;
  document.getElementById('backLink').textContent = t.back;
  document.getElementById('footer').textContent = t.footer;
}

function goToPlanner(){
  window.location.href = '/planner/?category=' + CATEGORY + '&days=' + DAYS;
}

function openLangSheet(){
  const t = PAGE_I18N[curLang] || PAGE_I18N.en;
  document.getElementById('langSheetTitle').textContent = t.langTitle;
  document.getElementById('langGrid').innerHTML = LANGUAGES.map(l =>
    '<div class="langItem' + (l.code===curLang?' sel':'') + '" onclick="switchLang(\'' + l.code + '\')">' +
    '<div style="font-size:1.3rem">' + l.flag + '</div><div>' + l.name + '</div></div>'
  ).join('');
  document.getElementById('langOverlay').style.display = 'block';
}
function closeLangSheet(){ document.getElementById('langOverlay').style.display = 'none'; }
function switchLang(code){
  curLang = code;
  try { localStorage.setItem('sak_lang', code); } catch(e) {}
  render();
  closeLangSheet();
}

render();
</script>
