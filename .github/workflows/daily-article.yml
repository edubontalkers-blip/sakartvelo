name: Daily Article Generator

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate article
        run: python scripts/generate_article.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push new article
        run: |
          git config user.email "bot@sakartvelo.ai"
          git config user.name "Chacha Bot"
          git add -A
          git diff --staged --quiet || git commit -m "Add new article $(date +%Y-%m-%d)"
          git push
