document.getElementById('langOverlay').onclick=(e)=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');};
document.querySelectorAll('.lp-btn').forEach(b=>{b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('lang',lang);document.getElementById('langOverlay').classList.remove('open');render();}});
document.getElementById('themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';};
if(localStorage.getItem('theme')==='dark'){document.documentElement.dataset.theme='dark';document.getElementById('themeBtn').textContent='☀️';}
render();
</script></body></html>
