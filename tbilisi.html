*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}

.nav-right{display:flex;align-items:center;gap:8px}
.lang-btn{background:var(--card-2);border:1px solid var(--line);border-radius:100px;padding:5px 10px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.theme-btn{background:none;border:none;font-size:1.2rem;cursor:pointer;padding:4px}

/* LANG PICKER */
.lang-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end}
.lang-overlay.open{display:flex}
.lang-sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-height:70vh;overflow-y:auto}
.lang-sheet h3{font-family:var(--font-display);font-size:1.1rem;margin-bottom:14px;color:var(--ink)}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lp-btn{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left}
.lp-btn.active{border-color:var(--gold);background:rgba(200,145,31,.1)}
.lp-flag{font-size:1.4rem}
.lp-name{font-size:.85rem;font-weight:600;color:var(--ink)}
.lp-native{font-size:.72rem;color:var(--muted)}

/* HERO */
.hero{padding:24px 16px 16px;text-align:center}
.hero-emoji{font-size:3rem;margin-bottom:8px}
.hero h1{font-family:var(--font-display);font-size:1.9rem;font-weight:900;line-height:1.2;margin-bottom:8px}
.hero h1 .em{color:var(--gold);font-style:italic}
.hero .sub{color:var(--muted);font-size:.95rem;max-width:400px;margin:0 auto 16px}

/* BACK */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:.85rem;margin:0 16px 8px;padding:6px 12px;background:var(--card-2);border-radius:100px;border:1px solid var(--line)}

/* CARDS */
.content{padding:0 16px 32px;max-width:600px;margin:0 auto}
.section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.section-title{font-family:var(--font-display);font-weight:900;font-size:1rem;color:var(--gold);margin-bottom:10px}
.fact-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.fact-list li{display:flex;gap:10px;font-size:.88rem;line-height:1.5;color:var(--ink)}
.fact-list li .icon{font-size:1.1rem;flex-shrink:0;margin-top:1px}

/* CTA */
.cta{background:linear-gradient(135deg,var(--wine-bright),var(--gold));border-radius:var(--radius);padding:18px 16px;text-align:center;margin-bottom:14px}
.cta p{color:#fff;font-size:.9rem;margin-bottom:10px;opacity:.9}
.cta a{display:inline-block;background:#fff;color:var(--wine);font-weight:700;font-size:.9rem;padding:10px 24px;border-radius:100px}

/* OTHER PLACES */
.places-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.place-card{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.place-card .p-title{font-weight:700;font-size:.85rem}
.place-card .p-sub{font-size:.75rem;color:var(--muted)}

/* FOOTER */
footer{text-align:center;padding:20px 16px;color:var(--muted);font-size:.75rem;border-top:1px solid var(--line)}

// ── LOGIC ──────────────────────────────────────────────────
let lang = localStorage.getItem('lang') || navigator.language.slice(0,2);
if(!PAGE.data[lang]) lang = 'en';

function render(){
  const d = PAGE.data[lang] || PAGE.data.en;
  const u = UI[lang] || UI.en;
  const rtl = ['ar','he'].includes(lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';

  // meta
  document.getElementById('meta-title').textContent = d.title + ' – sakartvelo.ai';
  document.getElementById('meta-desc').content = d.sub;
  document.getElementById('hero-emoji').textContent = PAGE.emoji;
  document.getElementById('hero-title').textContent = d.title;
  document.getElementById('hero-sub').textContent = d.sub;
  document.getElementById('langLabel').textContent = lang.toUpperCase();

  // i18n
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(u[k]) el.textContent = u[k];
  });

  // must see
  document.getElementById('must-see-list').innerHTML = d.must.map(f=>
    `<li><span class="icon">${f.icon}</span><span>${f.text}</span></li>`).join('');

  // practical
  document.getElementById('practical-list').innerHTML = d.practical.map(f=>
    `<li><span class="icon">${f.icon}</span><span>${f.text}</span></li>`).join('');

  // other places
  const others = OTHER.filter(p=>p.slug !== PAGE.slug).slice(0,6);
  document.getElementById('other-places').innerHTML = others.map(p=>
    `<a href="/geo/${p.slug}/" class="place-card">
      <div class="p-title">${p.emoji} ${p[lang]||p.en}</div>
      <div class="p-sub">${lang==='ru'?p.sub_ru:p.sub_en}</div>
    </a>`).join('');

  // active lang btn
  document.querySelectorAll('.lp-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });
}

// lang picker
document.getElementById('langBtn').onclick = ()=>{
  document.getElementById('langOverlay').classList.add('open');
};
document.getElementById('langOverlay').onclick = (e)=>{
  if(e.target===e.currentTarget) e.currentTarget.classList.remove('open');
};
document.querySelectorAll('.lp-btn').forEach(b=>{
  b.onclick = ()=>{
    lang = b.dataset.lang;
    localStorage.setItem('lang',lang);
    document.getElementById('langOverlay').classList.remove('open');
    render();
  };
});

// theme
const theme = ()=> document.documentElement.dataset.theme || 'light';
document.getElementById('themeBtn').onclick = ()=>{
  const t = theme()==='dark'?'light':'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme',t);
  document.getElementById('themeBtn').textContent = t==='dark'?'☀️':'🌙';
};
if(localStorage.getItem('theme')==='dark'){
  document.documentElement.dataset.theme='dark';
  document.getElementById('themeBtn').textContent='☀️';
}

render();
</script>
